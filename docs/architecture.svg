<svg width="860" height="640" viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Webhook relay architecture: producer publishes an event, the ingest API writes a message and fans out delivery rows in one transaction, and a dispatcher loop claims, signs, sends and records each attempt." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="330" y="20" width="200" height="52" rx="8" fill="#5B7FB9"/>
  <text x="430" y="42" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Producer</text>
  <text x="430" y="61" text-anchor="middle" fill="#E4ECF7" font-size="12">emits order.paid</text>

  <line x1="430" y1="72" x2="430" y2="100" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="444" y="90" fill="#8A8A8A" font-size="12">POST /events</text>

  <rect x="230" y="105" width="400" height="80" rx="8" fill="#6B5DB8"/>
  <text x="430" y="128" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Ingest API</text>
  <text x="430" y="149" text-anchor="middle" fill="#DCD7F3" font-size="12">one transaction: 1 message + N delivery rows</text>
  <text x="430" y="169" text-anchor="middle" fill="#DCD7F3" font-size="12">returns 202 Accepted — durability, not delivery</text>

  <line x1="430" y1="185" x2="430" y2="212" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="217" width="680" height="112" rx="12" fill="none" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="110" y="240" fill="#8A8A8A" font-size="13" font-weight="600">PostgreSQL</text>

  <rect x="110" y="253" width="145" height="56" rx="6" fill="#4A8B7A"/>
  <text x="182" y="275" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">messages</text>
  <text x="182" y="294" text-anchor="middle" fill="#D8EBE5" font-size="11">what happened</text>

  <rect x="275" y="253" width="145" height="56" rx="6" fill="#4A8B7A"/>
  <text x="347" y="275" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">deliveries</text>
  <text x="347" y="294" text-anchor="middle" fill="#D8EBE5" font-size="11">the work queue</text>

  <rect x="440" y="253" width="145" height="56" rx="6" fill="#4A8B7A"/>
  <text x="512" y="275" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">delivery_attempts</text>
  <text x="512" y="294" text-anchor="middle" fill="#D8EBE5" font-size="11">per-attempt log</text>

  <rect x="605" y="253" width="145" height="56" rx="6" fill="#4A8B7A"/>
  <text x="677" y="275" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">endpoints</text>
  <text x="677" y="294" text-anchor="middle" fill="#D8EBE5" font-size="11">url + secret</text>

  <line x1="430" y1="329" x2="430" y2="358" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="363" width="680" height="112" rx="12" fill="none" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="110" y="386" fill="#8A8A8A" font-size="13" font-weight="600">Dispatcher loop — polls every second</text>

  <rect x="110" y="399" width="145" height="56" rx="6" fill="#6B5DB8"/>
  <text x="182" y="421" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">1. Claim</text>
  <text x="182" y="440" text-anchor="middle" fill="#DCD7F3" font-size="11">SKIP LOCKED</text>

  <rect x="275" y="399" width="145" height="56" rx="6" fill="#6B5DB8"/>
  <text x="347" y="421" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">2. Sign</text>
  <text x="347" y="440" text-anchor="middle" fill="#DCD7F3" font-size="11">HMAC-SHA256</text>

  <rect x="440" y="399" width="145" height="56" rx="6" fill="#6B5DB8"/>
  <text x="512" y="421" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">3. Send</text>
  <text x="512" y="440" text-anchor="middle" fill="#DCD7F3" font-size="11">httpx, 10s timeout</text>

  <rect x="605" y="399" width="145" height="56" rx="6" fill="#6B5DB8"/>
  <text x="677" y="421" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">4. Record</text>
  <text x="677" y="440" text-anchor="middle" fill="#DCD7F3" font-size="11">classify + backoff</text>

  <path d="M430 475L430 512L172 512" fill="none" stroke="#8A8A8A" stroke-width="1.6"/>
  <path d="M430 512L692 512" fill="none" stroke="#8A8A8A" stroke-width="1.6"/>
  <line x1="172" y1="512" x2="172" y2="540" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="432" y1="512" x2="432" y2="540" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="692" y1="512" x2="692" y2="540" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="55" y="545" width="235" height="66" rx="8" fill="#3D8B5F"/>
  <text x="172" y="568" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Healthy subscriber</text>
  <text x="172" y="588" text-anchor="middle" fill="#DAEDE2" font-size="11">200 OK — delivered on attempt 1</text>
  <text x="172" y="604" text-anchor="middle" fill="#DAEDE2" font-size="11">did not wait for the others</text>

  <rect x="315" y="545" width="235" height="66" rx="8" fill="#B8862B"/>
  <text x="432" y="568" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Temporarily down</text>
  <text x="432" y="588" text-anchor="middle" fill="#F7EAD3" font-size="11">connection refused — retrying</text>
  <text x="432" y="604" text-anchor="middle" fill="#F7EAD3" font-size="11">8 attempts, backoff + jitter</text>

  <rect x="575" y="545" width="235" height="66" rx="8" fill="#B34A45"/>
  <text x="692" y="568" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Permanently wrong</text>
  <text x="692" y="588" text-anchor="middle" fill="#F7DEDC" font-size="11">401 — dead after 1 attempt</text>
  <text x="692" y="604" text-anchor="middle" fill="#F7DEDC" font-size="11">no retry, waits for replay</text>
</svg>
